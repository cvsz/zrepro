name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Validate reverse-engineering catalog and fixtures
        run: python3 scripts/validate_re_catalog.py

      - name: Exercise repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Install MCP service test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e 'services/mcp[dev]'

      - name: Validate MCP service
        run: |
          ruff check services/mcp/src services/mcp/tests
          pytest -q services/mcp/tests

      - name: Check for common secret file names
        run: python3 scripts/check_secret_files.py

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; (Dir.glob(".github/**/*.{yml,yaml}") + Dir.glob("components.d/*.{yml,yaml}") + Dir.glob("plugins.d/*.{yml,yaml}")).uniq.each { |f| YAML.load_file(f); puts "ok #{f}" }'
